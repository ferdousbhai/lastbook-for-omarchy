name: Native packages
# Started by bin/release on the release tag; changes are checked by bin/check and ci.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            dist/cargo-${{ matrix.arch }}/registry/index
            dist/cargo-${{ matrix.arch }}/registry/cache
            dist/cargo-${{ matrix.arch }}/git/db
          key: cargo-downloads-${{ matrix.arch }}-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: |
            cargo-downloads-${{ matrix.arch }}-
      - name: Install Arch chroot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y arch-install-scripts zstd
      - name: Build and scan the package
        run: sudo bin/arch-run bin/build-packages '${{ matrix.arch }}' /output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lastbook-for-omarchy-${{ matrix.arch }}
          path: |
            dist/${{ matrix.arch }}/*.pkg.tar.zst
            dist/${{ matrix.arch }}/source-commit.txt
          if-no-files-found: error
