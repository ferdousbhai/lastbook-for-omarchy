name: CI
# Every push to a branch (not a tag: a release tag's commit was tested when it was pushed), and every pull request
# (which also covers those from forks).
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Arch itself: the package's Python (3.14, which the pinned wheels are built for), GTK 4 and WebKitGTK 6.
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    # GitHub sets CI=true, so a test that needs a tool this job lacks (lsof, libzim) fails here where it would skip on a
    # contributor's computer: a skipped check proves nothing, and a green run would hide it (app/tests, tests/install_test.sh).
    steps:
      # gtk4 brings gtk4-broadwayd, the display the scripted window QA runs on, and a font for it (adwaita-fonts); lsof
      # is test_bridge's check that the engine listens on no socket.
      - name: Install Arch packages
        run: |
          pacman -Syu --noconfirm --needed git curl base-devel rust pkgconf gtk4 webkitgtk-6.0 poppler-glib sqlite \
            gstreamer gst-plugins-base python python-numpy lsof
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            native/target
          key: cargo-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: |
            cargo-
      # What the tests need beyond the packages above: libzim and pypdfium2, from the PKGBUILD's pinned wheels. Fetched
      # here, so that a wheel that cannot be had fails this step by name and not a test that then has no libzim.
      - name: Fetch the pinned wheels (libzim, pypdfium2)
        run: |
          PYTHONPATH=$(bin/test-deps) python3 -c 'import libzim, pypdfium2'
          command -v lsof gtk4-broadwayd
      # One version (VERSION is native/Cargo.toml's), the window's tests (cargo test, then every script in native/dev/qa
      # driven on a broadway display, where any GLib warning or critical fails the run), then the engine's (README, Tests).
      - run: bin/test
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The installer's scenarios run in a user namespace of their own, which Ubuntu's AppArmor refuses by default.
      - run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo touch /etc/pacman.conf && sudo mkdir -p /etc/pacman.d   # what the scenarios mount their scratch copies over
      # `bash -n` on every script, then the installer (tests/install_test.sh).
      - run: tests/install_test.sh
