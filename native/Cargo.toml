[package]
name = "lastbook"
version = "1.2.0"
edition = "2024"
license = "MIT"
description = "Offline survival library for Omarchy: the native GTK 4 window"
repository = "https://github.com/ferdousbhai/lastbook-for-omarchy"
publish = false

[dependencies]
# The look and the shared widgets (theme from Omarchy, icons, header, small builders). A path to the frozen 0.1
# checkout until omui is published, when it becomes a git dependency pinned by `rev`.
omui = { path = "/home/x/github.com/ferdousbhai/omui-pin-0.1" }
# The gtk4 crate omui is built with, at the feature level this window needs.
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_14"] }
cairo-rs = "0.22.9"
poppler = { package = "poppler-rs", version = "0.26.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-channel = "2.3"
urlencoding = "2.1"
pulldown-cmark = { version = "0.13", default-features = false }
webkit6 = { version = "0.6.1", features = ["v2_50"] }
base64 = "0.22"
rusqlite = "0.43.0"
flate2 = "1.1.11"
pangocairo = "0.22"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
