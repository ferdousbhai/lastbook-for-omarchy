[package]
name = "lastbook"
version = "1.4.0"
edition = "2024"
license = "MIT"
description = "Offline survival library for Omarchy: the native GTK 4 window"
repository = "https://github.com/ferdousbhai/lastbook-for-omarchy"
publish = false

[dependencies]
# The look and the shared widgets (theme from Omarchy, icons, header, small builders), pinned by commit (v0.5.2).
omui = { git = "https://github.com/ferdousbhai/omui", rev = "40737b7a74567654fc3fa7ac8c1037b42255afd4" }
# The gtk4 crate omui is built with, at the feature level this window needs.
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_14"] }
poppler = { package = "poppler-rs", version = "0.26.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-channel = "2.3"
urlencoding = "2.1"
webkit6 = { version = "0.6.1", features = ["v2_50"] }
base64 = "0.22"
rusqlite = "0.43.0"
flate2 = "1.1.11"
pangocairo = "0.22"

[features]
# Scripted QA (dev/qa.sh, run by bin/test): OMUI_QA=1 drives the window from JSON lines on stdin. Release builds leave it
# off.
qa = ["omui/qa"]

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
